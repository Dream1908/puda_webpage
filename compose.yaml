name: ${COMPOSE_PROJECT_NAME:-puda-webpage}

services:
    hermes-agent:
        image: nousresearch/hermes-agent:latest
        command: gateway run
        restart: unless-stopped
        env_file:
            - .env
        environment:
            HERMES_HOME: /home/hermes/.hermes
            HERMES_UID: ${WANTED_UID:-1000}
            HERMES_GID: ${WANTED_GID:-1000}
        volumes:
            - ${HOME:-${USERPROFILE}}/.hermes:/home/hermes/.hermes
            - hermes-agent-src:/opt/hermes
        ports:
            - "127.0.0.1:8642:8642"
        networks:
            - hermes

    hermes-webui:
        build:
            context: .
            dockerfile: Dockerfile.webui
        restart: unless-stopped
        depends_on:
            - hermes-agent
        env_file:
            - .env
        environment:
            HERMES_HOME: /home/hermeswebui/.hermes
            HERMES_WEBUI_AGENT_DIR: /home/hermeswebui/.hermes/hermes-agent
            HERMES_API_URL: http://hermes-agent:8642
        volumes:
            - ${HOME:-${USERPROFILE}}/.hermes:/home/hermeswebui/.hermes
            - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
            - ${HOME:-${USERPROFILE}}/workspace:/workspace
        ports:
            - "127.0.0.1:${HERMES_WEBUI_PORT:-8787}:8787"
        networks:
            - hermes

networks:
    hermes:
        driver: bridge

volumes:
    hermes-agent-src:
